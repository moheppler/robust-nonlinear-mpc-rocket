name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install package (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite (stock OSQP path)
        run: python -m pytest -q

      - name: Fast-vs-stock equivalence gate (compiles the fast solver)
        env:
          RNMPC_FAST_TESTS: "1"
        run: python -m pytest tests/test_backend_equivalence.py -q

      - name: Compiled-QP backend equivalence
        env:
          RNMPC_QP_CODEGEN: "1"
        run: python -m pytest tests/test_qp_jit.py -q
